name: Publish Checker
on:
  push:
    branches:
      - main
    paths:
      - "apps/checker/**"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: checker

jobs:
  build-checker:
    runs-on: ubuntu-latest
    # Permissions to use OIDC token authentication
    permissions:
      contents: read
      id-token: write
      # Allows pushing to the GitHub Container Registry
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push checker
        uses: docker/build-push-action@v6
        with:
          context: apps/checker
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/openstatus-checker:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/checker:latest
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
  build-private-location:
    runs-on: ubuntu-latest
    # Permissions to use OIDC token authentication
    permissions:
      contents: read
      id-token: write
      # Allows pushing to the GitHub Container Registry
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push private-location
        uses: docker/build-push-action@v6
        with:
          file: apps/checker/private-location.Dockerfile
          context: apps/checker
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/openstatus-private-location:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/private-location:latest
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
